<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#03045e" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22334e" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.7" />

  <!-- Synaptic Streamlines -->
  <path d="M 90 256 C 140 160, 200 120, 256 196 S 380 340, 430 256" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" filter="url(#glow)" />
  <path d="M 120 380 C 180 360, 210 280, 256 256 S 340 160, 390 120" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.85" filter="url(#glow)" />
  <path d="M 180 100 C 230 180, 280 200, 320 280 S 370 380, 340 420" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  <path d="M 80 180 C 150 200, 220 230, 256 256 S 330 310, 420 330" fill="none" stroke="#48cae4" stroke-width="1.5" opacity="0.7" />

  <!-- Core Celestial Body / Neural Soma -->
  <circle cx="256" cy="256" r="70" fill="url(#starGlow)" />
  <circle cx="256" cy="256" r="42" fill="#0b1329" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#000000" stroke="#00f5d4" stroke-width="2" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#glow)" />

  <!-- Planetary Moons / Neural Nodes -->
  <!-- Node 1 (Cyan Telemetry Node) -->
  <circle cx="160" cy="140" r="14" fill="#03071e" stroke="#00f5d4" stroke-width="2" />
  <rect x="156" y="136" width="8" height="8" fill="#00f5d4" />
  <line x1="160" y1="140" x2="256" y2="256" stroke="#00f5d4" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Node 2 (Exam / Major Body) -->
  <circle cx="370" cy="190" r="22" fill="#0d1b2a" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="370" cy="190" r="10" fill="#e0e1dd" />
  <circle cx="370" cy="190" r="30" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />

  <!-- Node 3 (Syllabus Orbit) -->
  <circle cx="340" cy="370" r="16" fill="#1b263b" stroke="#48cae4" stroke-width="2" />
  <circle cx="340" cy="370" r="6" fill="#48cae4" />

  <!-- Node 4 (Notes Satellite) -->
  <circle cx="140" cy="350" r="18" fill="#0d1b2a" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="140" cy="350" r="8" fill="#90e0ef" />

  <!-- Telemetry HUD brackets -->
  <path d="M 50 100 L 70 100 M 50 100 L 50 120" stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 462 100 L 442 100 M 462 100 L 462 120" stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 50 412 L 70 412 M 50 412 L 50 392" stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 462 412 L 442 412 M 462 412 L 462 392" stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.8" />

  <!-- HUD Coordinates text -->
  <text x="56" y="90" fill="#00f5d4" font-family="monospace" font-size="14" letter-spacing="2">SYNAPSE-ORBIT // 57.0062</text>
  <text x="330" y="440" fill="#90e0ef" font-family="monospace" font-size="12" letter-spacing="1">G-4/2 [SR-7832]</text>
</svg>
